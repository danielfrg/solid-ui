name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish: 1.0.0"
        required: true
        type: string
      tag:
        description: "npm dist-tag"
        required: false
        type: choice
        default: latest
        options:
          - latest
          - next
          - beta
      dry-run:
        description: "Dry run (no publish)"
        required: false
        type: boolean
        default: false

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format -- --check

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test:run

  release:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set package version
        working-directory: packages/ui
        run: bun -e "import fs from 'node:fs'; const path = 'package.json'; const pkg = JSON.parse(fs.readFileSync(path, 'utf8')); pkg.version = '${{ inputs.version }}'; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');"

      - name: Publish to npm (dry run)
        if: ${{ inputs.dry-run }}
        working-directory: packages/ui
        run: npm publish --tag ${{ inputs.tag }} --dry-run

      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        working-directory: packages/ui
        run: npm publish --tag ${{ inputs.tag }} --access public

      - name: Create GitHub Release
        if: ${{ !inputs.dry-run }}
        run: gh release create "v${{ inputs.version }}" --generate-notes --title "v${{ inputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
